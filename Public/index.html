<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Loom</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="stylesheet" href="/css/tokens.css" />
		<link rel="stylesheet" href="/css/app.css" />
	</head>
	<body>
		<header class="app-header" id="app-header" data-workspace="false">
			<img class="app-logo" src="/favicon.svg" alt="" />
			<span class="app-wordmark">Loom</span>
		</header>

		<div class="empty-state" id="empty-state">
			<button class="empty-card" id="open-folder" type="button">
				<span class="empty-icon">
					<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6A2 2 0 0 1 18.46 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
				</span>
				<span class="empty-text">
					<span class="empty-eyebrow" id="empty-eyebrow">No workspace loaded</span>
					<span class="empty-title" id="empty-title">Open a folder to start</span>
				</span>
				<span class="empty-rule"></span>
			</button>
		</div>

		<div class="workspace" id="workspace" hidden>
			<aside class="sidebar">
				<div class="sidebar-header">
					<span class="sidebar-folder-icon">
						<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 14l1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6A2 2 0 0 1 18.46 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg>
					</span>
					<span class="sidebar-meta">
						<span class="sidebar-eyebrow">Folder</span>
						<span class="sidebar-name" id="root-name"></span>
					</span>
					<span class="sidebar-actions">
						<button class="icon-btn" id="new-file" type="button" title="New file">
							<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>
						</button>
						<button class="icon-btn" id="new-folder" type="button" title="New folder">
							<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 5.9A2 2 0 0 0 7.93 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2Z"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
						</button>
						<button class="icon-btn" id="collapse-all" type="button" title="Collapse all folders">
							<svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
						</button>
					</span>
				</div>
				<div class="tree" id="tree" role="tree"></div>
			</aside>

			<section class="editor-area">
				<div class="tabstrip" id="tabstrip"></div>
				<div class="breadcrumb-row">
					<span class="breadcrumb" id="breadcrumb"></span>
					<span class="save-status" id="save-status" hidden>
						<span class="save-text" id="save-text"></span>
						<button class="icon-btn" id="save-btn" type="button" title="Save to disk">
							<svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
						</button>
					</span>
				</div>
				<div class="editor-host" id="editor-host">
					<div class="editor-mount" id="editor-mount"></div>
					<div class="editor-placeholder" id="editor-placeholder">Select a file to edit</div>
				</div>
			</section>
		</div>

		<div class="context-menu" id="context-menu" hidden></div>

		<script type="module" src="/js/app.js"></script>
	</body>
</html>
